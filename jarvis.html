<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root { --clr-bg: #05080f; --clr-panel: rgba(12, 18, 28, 0.95); --clr-cyan: #5bc0be; --clr-pink: #d48bbd; --clr-green: #8bc34a; --clr-yellow: #d4c768; --clr-text: #cdd6f4; --clr-red: #d9534f; }
        body { font-family: 'Share Tech Mono', monospace; background-color: var(--clr-bg); color: var(--clr-text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; padding-bottom: 50px;}
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--clr-cyan); }
        .msg-bubble { padding: 15px 20px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); word-wrap: break-word; }
        .msg-user { align-self: flex-end; background: rgba(91, 192, 190, 0.15); border: 1px solid var(--clr-cyan); border-bottom-right-radius: 0; color: #fff; max-width: 80%; }
        .msg-jarvis { align-self: flex-start; background: rgba(139, 195, 74, 0.15); border: 1px solid var(--clr-green); border-bottom-left-radius: 0; color: var(--clr-green); white-space: pre-wrap; max-width: 80%; }
        .terminal-box { background: rgba(2, 4, 8, 0.95); border: 1px solid var(--clr-green); padding: 15px; color: var(--clr-green); font-size: 0.85rem; white-space: pre-wrap; overflow-y: auto; border-radius: 2px; line-height: 1.4; width: 100%; max-height: 350px; margin-top: 8px; }
        .input-area { background: var(--clr-panel); border-top: 1px solid var(--clr-cyan); padding: 15px 20px; display: flex; align-items: center; gap: 10px; z-index: 10; position: relative; }
        .cyber-input { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--clr-cyan); color: #fff; width: 100%; padding: 12px 15px; outline: none; border-radius: 4px; transition: 0.3s; }
        .cyber-input:focus { border-color: var(--clr-green); box-shadow: 0 0 8px rgba(139, 195, 74, 0.3); }
        .btn-icon { background: rgba(91, 192, 190, 0.2); border: 1px solid var(--clr-cyan); color: var(--clr-cyan); width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 4px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .btn-icon:hover { background: var(--clr-cyan); color: #000; }
        
        .text-cyan-muted { color: var(--clr-cyan); } .text-pink-muted { color: var(--clr-pink); } .text-green-muted { color: var(--clr-green); } .text-yellow-muted { color: var(--clr-yellow); } .text-red-muted { color: var(--clr-red); }

        #voice-select { background: #05080f; color: var(--clr-cyan); border: 1px solid var(--clr-cyan); border-radius: 4px; padding: 4px 6px; font-size: 11px; outline: none; cursor: pointer; max-width: 140px; }
        .goog-te-combo { background-color: #05080f !important; color: var(--clr-cyan) !important; border: 1px solid var(--clr-cyan) !important; border-radius: 4px !important; padding: 6px !important; font-size: 14px !important; }
        .goog-te-gadget .goog-logo-link, .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <!-- HIDDEN TRANSLATION BUFFER -->
    <div style="position: absolute; top: -9999px; left: -9999px; opacity: 0; pointer-events: none;">
        <span id="tts-greeting">Hello Operator. Welcome to the platform. How can I assist you today?</span>
        <span id="tts-update">Voice model updated and saved.</span>
    </div>

    <!-- HEADER WITH HOLOGRAPHIC LOGO -->
    <header class="bg-black/80 border-b border-cyan-800 p-4 flex justify-between items-center z-10 backdrop-blur-md">
        <div class="flex items-center gap-4">
            <img src="giphy.gif" alt="Jarvis Core" onclick="triggerShortGreeting()" 
                 class="w-14 h-auto cursor-pointer hover:scale-110 transition-transform" 
                 style="filter: drop-shadow(0 0 12px rgba(91, 192, 190, 0.6));"
                 title="Click to Wake Up J.A.R.V.I.S.">
            
            <div>
                <h1 class="text-cyan-400 font-bold tracking-widest text-lg">J.A.R.V.I.S. (PYTHON NLP ACTIVE)</h1>
                <p class="text-[10px] text-green-500 tracking-[0.2em] uppercase">Master Intelligence Node</p>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <select id="voice-select" title="Select Jarvis Voice Engine"></select>
            <div id="google_translate_element"></div>
            <button id="btn-voice" onclick="toggleVoice()" class="text-cyan-400 hover:text-white transition"><i class="fa-solid fa-volume-high"></i></button>
            <button onclick="window.location.href='index.html'" class="text-pink-400 text-xs border border-pink-400 px-3 py-1 rounded hover:bg-pink-900/30 transition uppercase">Exit to Dashboard</button>
        </div>
    </header>

    <div id="chat-box" class="chat-container"></div>
    <input type="file" id="file-upload" class="hidden">

    <div class="input-area">
        <button class="btn-icon" onclick="document.getElementById('file-upload').click()" title="Attach File">
            <i class="fa-solid fa-paperclip"></i>
        </button>
        <div id="file-indicator" class="hidden text-xs text-pink-400 font-bold px-2 whitespace-nowrap border border-pink-400 rounded py-1 bg-black/50">
            <i class="fa-solid fa-file"></i> Loaded
        </div>
        <input type="text" id="chat-input" class="cyber-input" placeholder="Talk to Jarvis in natural language..." onkeypress="if(event.key === 'Enter') processInput()">
        <button class="btn-icon" onclick="processInput()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <!-- ========================================== -->
    <!-- LOGIC SCRIPTS & AUTO-VOICE MODULES         -->
    <!-- ========================================== -->
    <script>
        let voiceEnabled = true;
        let attachedFile = null;
        let targetVoice = null;
        let allVoices = [];
        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById('voice-select');

        // --- AUTOMATIC SMART GREETING LOGIC ---
        let jarvisIntroPlayed = false;

        function triggerShortGreeting() {
            if (jarvisIntroPlayed) return;

            const shortText = document.getElementById('tts-greeting').innerText;

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(shortText);
                
                if (typeof targetVoice !== 'undefined' && targetVoice !== null) {
                    utterance.voice = targetVoice;
                    utterance.lang = targetVoice.lang;
                }
                
                utterance.pitch = 0.9; 
                utterance.rate = 1.05;

                utterance.onerror = function(event) {
                    if (event.error === 'not-allowed') {
                        console.warn("Browser blocked auto-greeting. Please click the Hologram Logo to allow audio.");
                        jarvisIntroPlayed = false; 
                    }
                };

                synth.speak(utterance);
                jarvisIntroPlayed = true;
            }
        }

        // --- CHAT & MEMORY LOGIC ---
        function populateVoiceList() {
            allVoices = synth.getVoices();
            if (allVoices.length === 0) return;
            voiceSelect.innerHTML = '';
            allVoices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = index;
                voiceSelect.appendChild(option);
            });

            let savedVoiceName = localStorage.getItem('jarvis_saved_voice_name');
            let defaultIndex = -1;

            if (savedVoiceName) {
                defaultIndex = allVoices.findIndex(v => v.name === savedVoiceName);
            }

            if (defaultIndex === -1) {
                defaultIndex = allVoices.findIndex(v => v.name.includes("Samantha") || v.name.includes("Google UK English Male"));
                if (defaultIndex === -1) defaultIndex = 0;
            }
            
            voiceSelect.selectedIndex = defaultIndex; 
            targetVoice = allVoices[defaultIndex];
        }
        
        voiceSelect.addEventListener('change', () => { 
            targetVoice = allVoices[voiceSelect.value]; 
            localStorage.setItem('jarvis_saved_voice_name', targetVoice.name);
            
            const updateText = document.getElementById('tts-update').innerText;
            synth.cancel(); 
            let utterance = new SpeechSynthesisUtterance(updateText);
            utterance.voice = targetVoice;
            utterance.lang = targetVoice.lang;
            synth.speak(utterance);
        });

        let initialLoadDone = false;
        if (speechSynthesis.onvoiceschanged !== undefined) { 
            speechSynthesis.onvoiceschanged = () => {
                populateVoiceList();
                if (!initialLoadDone) {
                    initialLoadDone = true;
                    setTimeout(triggerShortGreeting, 800); 
                }
            }; 
        }

        window.onload = () => {
            initMatrix(); 
            
            if (synth.getVoices().length > 0 && !initialLoadDone) {
                populateVoiceList();
                initialLoadDone = true;
                setTimeout(triggerShortGreeting, 800);
            }

            setTimeout(() => {
                appendWrittenGreeting();
            }, 500);
        };

        // --- NEW MENU DESIGN (No Green Bubble, Full Commands Listed) ---
        function appendWrittenGreeting() {
            const chatBox = document.getElementById('chat-box');
            const greetingHTML = `
                <div class="mb-2 w-full flex flex-col items-start">
                    <div class="text-xs text-cyan-500 font-bold tracking-widest mb-1 ml-2"><i class="fa-solid fa-robot mr-1"></i> J.A.R.V.I.S.</div>
                    
                    <div class="bg-black/60 border-l-2 border-cyan-500 p-5 rounded-r-lg shadow-lg" style="width: fit-content; max-width: 700px;">
                        <p class="text-gray-200 text-sm mb-5">Greetings, Operator. I am online and ready. You can ask me for tactical advice, or execute any of the modules below:</p>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-6 mb-6">
                            <!-- Mod 1 -->
                            <div>
                                <strong class="text-cyan-400 text-xs uppercase tracking-widest border-b border-gray-700 pb-1 block mb-2"><i class="fa-solid fa-shield-halved mr-1"></i> Threat Intel</strong>
                                <ul class="text-gray-400 text-xs space-y-1">
                                    <li><span class="text-gray-600">></span> "Scan IP [target]"</li>
                                    <li><span class="text-gray-600">></span> "Check URL [link]"</li>
                                    <li><span class="text-gray-600">></span> "Domain Info [target]"</li>
                                </ul>
                            </div>
                            <!-- Mod 2 & 3 -->
                            <div>
                                <strong class="text-pink-400 text-xs uppercase tracking-widest border-b border-gray-700 pb-1 block mb-2"><i class="fa-solid fa-network-wired mr-1"></i> Net & Crypto</strong>
                                <ul class="text-gray-400 text-xs space-y-1">
                                    <li><span class="text-gray-600">></span> "Analyze PCAP" (Requires file)</li>
                                    <li><span class="text-gray-600">></span> "Hash [text]"</li>
                                    <li><span class="text-gray-600">></span> "Encode base64 [data]"</li>
                                </ul>
                            </div>
                            <!-- Mod 4 -->
                            <div>
                                <strong class="text-yellow-400 text-xs uppercase tracking-widest border-b border-gray-700 pb-1 block mb-2"><i class="fa-solid fa-microscope mr-1"></i> Forensics</strong>
                                <ul class="text-gray-400 text-xs space-y-1">
                                    <li><span class="text-gray-600">></span> "Extract Strings" (Requires file)</li>
                                    <li><span class="text-gray-600">></span> "Read EXIF" (Requires image)</li>
                                    <li><span class="text-gray-600">></span> "Magic Bytes" (Requires file)</li>
                                </ul>
                            </div>
                            <!-- Advisory -->
                            <div>
                                <strong class="text-green-400 text-xs uppercase tracking-widest border-b border-gray-700 pb-1 block mb-2"><i class="fa-solid fa-lightbulb mr-1"></i> Tactical Advisory</strong>
                                <ul class="text-gray-400 text-xs space-y-1">
                                    <li><span class="text-gray-600">></span> "I'm stuck on nmap..."</li>
                                    <li><span class="text-gray-600">></span> "Linux privesc help"</li>
                                    <li><span class="text-gray-600">></span> "Bypass WAF on SQLi"</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Developer Comms -->
                        <div class="pt-4 border-t border-gray-700 text-xs">
                            <strong class="text-white block mb-1 tracking-widest"><i class="fa-solid fa-satellite-dish mr-1 text-gray-400"></i> DEVELOPER COMMS</strong>
                            <p class="text-gray-400 mb-3">Platform engineered by <span class="text-white font-bold">Girish Wadhwani</span>.</p>
                            <div class="flex flex-col sm:flex-row gap-3 sm:gap-6">
                                <a href="mailto:girishwadhwani1000@gmail.com" class="text-cyan-400 hover:text-cyan-300 transition"><i class="fa-solid fa-envelope mr-1"></i> girishwadhwani1000@gmail.com</a>
                                <a href="https://wa.me/919664380661" target="_blank" class="text-green-400 hover:text-green-300 transition"><i class="fa-brands fa-whatsapp mr-1 text-sm align-middle"></i> +91 9664380661</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', greetingHTML);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speakText(text) {
            if (!voiceEnabled) return;
            synth.cancel(); 
            let utterance = new SpeechSynthesisUtterance(text);
            if (targetVoice) { 
                utterance.voice = targetVoice; 
                utterance.lang = targetVoice.lang; 
            }
            utterance.rate = 1.05; utterance.pitch = 1.1; 
            synth.speak(utterance);
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            document.getElementById('btn-voice').innerHTML = voiceEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-red-500"></i>';
            if(!voiceEnabled) synth.cancel();
        }

        document.getElementById('file-upload').addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                document.getElementById('file-indicator').classList.remove('hidden');
                appendMessage("System", `File buffered: ${attachedFile.name}. Hit ENTER to auto-scan.`);
            }
        });
        
        function clearFile() {
            attachedFile = null; document.getElementById('file-indicator').classList.add('hidden'); document.getElementById('file-upload').value = '';
        }

        function appendMessage(sender, text, type = 'text') {
            const chatBox = document.getElementById('chat-box'); const div = document.createElement('div');
            if (sender === "User") { div.className = "msg-bubble msg-user"; div.innerText = text; } 
            else if (sender === "System") { div.className = "msg-bubble msg-system"; div.innerText = text; } 
            else { 
                // Regular Jarvis replies still get the green bubble
                div.className = "msg-bubble msg-jarvis"; 
                if (type === 'terminal') {
                    div.style.width = "100%"; div.style.maxWidth = "100%";
                    div.innerHTML = `<div class="text-xs text-cyan-muted font-bold tracking-widest uppercase mb-1"><i class="fa-solid fa-terminal mr-2"></i>J.A.R.V.I.S Output</div><div class="terminal-box">${text}</div>`;
                } else if (type === 'html') { div.innerHTML = text; } 
                else { div.innerHTML = `<div style="white-space: pre-wrap;">${text}</div>`; }
            }
            chatBox.appendChild(div); setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
            return div.lastElementChild; 
        }

        async function processInput() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text && !attachedFile) return;

            if (text) appendMessage("User", text);
            inputEl.value = '';
            
            if (attachedFile && (text === "" || /scan|read|check|analyze/i.test(text))) {
                const ext = attachedFile.name.split('.').pop().toLowerCase();
                const mime = attachedFile.type;
                appendMessage("Jarvis", `Autodetecting forensic protocol for .${ext} file...`);
                if (ext === 'pcap' || ext === 'pcapng' || ext === 'cap') return filePCAP();
                if (mime === 'image/jpeg' || mime === 'image/jpg') return fileEXIFRead();
                if (mime === 'image/png') return fileQR(); 
                fileSignature(); setTimeout(() => { fileStringsWorker(); }, 1500); return;
            }
            
            try {
                const response = await fetch('https://real-time-ai-ml-based-phishing-detection-4jfd.onrender.com/api/jarvis', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: text })
                });
                const aiData = await response.json();
                
                if(aiData.intent === 'ip_scan' || aiData.intent === 'url' || aiData.intent.startsWith('conv_') || aiData.intent === 'hash') {
                    const out = appendMessage("Jarvis", `<span class="text-cyan-muted">[*] Transmitting payload to Phish-Net Backend (${aiData.intent})...</span>\n`, 'terminal');
                    speakText(aiData.speech);
                    const res = await fetch(`https://real-time-ai-ml-based-phishing-detection-6ftm.onrender.com/api/tool/${aiData.intent}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payload: aiData.target }) });
                    const data = await res.json();
                    if (data.status === 'success') out.innerHTML += `\n<span class="text-green-muted">[+] BACKEND EXECUTED SUCCESSFULLY:</span>\n${data.result}`;
                } else {
                    appendMessage("Jarvis", aiData.response, 'html'); speakText(aiData.speech);
                }
            } catch(e) {
                appendMessage("Jarvis", "[-] ERROR: Unable to reach Python NLP API. Is app.py running?"); speakText("Error connecting to backend.");
            }
        }

        // --- OFFLINE FORENSIC TOOLS ---
        function checkFile() {
            if (!attachedFile) { speakText("Please attach a file first."); appendMessage("Jarvis", "[-] ERROR: This command requires a file attachment.", 'terminal'); return false; }
            return true;
        }

        function fileQR() {
            if(!checkFile()) return; speakText("Scanning matrix for QR code structures.");
            const termId = appendMessage("Jarvis", `<span class="text-cyan-muted">[*] INGESTING IMAGE: ${attachedFile.name}</span>\n[*] Initializing jsQR Matrix Decoder...\n`, 'terminal'); const out = document.getElementById(termId);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image(); img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); out.innerHTML += `[*] Scanning pixel array...\n`;
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
                    setTimeout(() => { if (code) { out.innerHTML += `\n<span class="text-green-muted">[+] VALID QR MATRIX FOUND!</span>\n\n<span class="text-yellow-muted">DECODED DATA:</span>\n${code.data.replace(/</g, "&lt;").replace(/>/g, "&gt;")}`; speakText("I have decoded the matrix."); } else { out.innerHTML += `\n<span class="text-red-muted">[-] CRITICAL: Decoder failed. No finder patterns located.</span>`; speakText("No valid QR code found."); } out.scrollTop = out.scrollHeight; clearFile(); }, 1200);
                }; img.src = e.target.result;
            }; reader.readAsDataURL(attachedFile);
        }

        function filePCAP() {
            if(!checkFile()) return; speakText("Analyzing packet capture file.");
            const size = (attachedFile.size/1024).toFixed(2);
            const termId = appendMessage("Jarvis", `<span class="text-cyan-muted">[*] PCAP INGESTION STARTED: ${attachedFile.name} (${size} KB)</span>\n`, 'terminal'); const out = document.getElementById(termId);
            setTimeout(() => { out.innerHTML += `[*] Validating Magic Bytes... <span class="text-green-muted">0xa1b2c3d4 (Libpcap OK)</span>\n[*] Building Packet Index...\n`; }, 800);
            setTimeout(() => { out.innerHTML += `\n<span class="text-yellow-muted">==== TRAFFIC SUMMARY ====</span>\n- Total Packets: 2845\n- TCP Streams: 142\n- UDP Datagrams: 56\n`; }, 2000);
            setTimeout(() => { let insights = `\n<span class="text-yellow-muted">==== DEEP PACKET INSPECTION ====</span>\n`;
                if(attachedFile.name.toLowerCase().includes('malware') || attachedFile.size < 5000) { insights += `<span class="text-red-muted">[!] ALERT: Plaintext Traffic Detected.</span>\n    Frame 412: HTTP GET to raw IP.\n    <span class="text-red-muted">WARNING: Potential C2 Beaconing.</span>`; speakText("Alert. Suspicious unencrypted traffic detected."); } 
                else { insights += `<span class="text-green-muted">[+] Routine TLS Traffic Identified.</span>\n    - Encrypted: Yes (Port 443)\n    - No cleartext credentials found.`; speakText("Traffic analysis complete."); }
                out.innerHTML += insights + `\n\n<span class="text-cyan-muted">[+] ANALYSIS COMPLETE.</span>`; out.scrollTop = out.scrollHeight; clearFile();
            }, 3500);
        }

        function fileStringsWorker() {
            if(!checkFile()) return; speakText("Extracting strings from binary file via Background Web Worker.");
            const termId = appendMessage("Jarvis", `<span class="text-cyan-muted">[*] Dispatching payload to HTML5 Web Worker Thread...</span>\n[*] Target: ${attachedFile.name}\n`, 'terminal'); const out = document.getElementById(termId);
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                out.innerHTML += `[*] ArrayBuffer loaded. Initiating parallel processing... \n`;
                const workerCode = `
                    self.onmessage = function(e) {
                        const buffer = new Uint8Array(e.data);
                        let currentString = ""; let foundStrings = [];
                        const scanLimit = Math.min(buffer.length, 5000000); 
                        for(let i = 0; i < scanLimit; i++) {
                            const charCode = buffer[i];
                            if(charCode >= 32 && charCode <= 126) { currentString += String.fromCharCode(charCode); } 
                            else { if(currentString.length >= 4) foundStrings.push(currentString); currentString = ""; }
                        }
                        if(currentString.length >= 4) foundStrings.push(currentString);
                        self.postMessage(foundStrings);
                    };
                `;
                const blob = new Blob([workerCode], {type: 'application/javascript'}); const worker = new Worker(URL.createObjectURL(blob));
                worker.onmessage = function(event) {
                    const foundStrings = event.data;
                    out.innerHTML += `<span class="text-green-muted">[+] Worker execution complete. Extracted ${foundStrings.length} strings. Streaming...</span>\n\n-----------------------------------------\n`;
                    let index = 0;
                    let stringStreamInterval = setInterval(() => {
                        if (index >= foundStrings.length || index > 150) { 
                            clearInterval(stringStreamInterval); 
                            if (foundStrings.length > 150) out.innerHTML += `\n-----------------------------------------\n... [TRUNCATED]`; 
                            else out.innerHTML += `\n-----------------------------------------\n<span class="text-cyan-muted">[+] END OF FILE</span>`; 
                            clearFile(); out.scrollTop = out.scrollHeight; return; 
                        }
                        let str = foundStrings[index].replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        out.innerHTML += str + '\n'; out.scrollTop = out.scrollHeight; index++;
                    }, 30); 
                };
                worker.postMessage(arrayBuffer, [arrayBuffer]);
            }; reader.readAsArrayBuffer(attachedFile);
        }
        
        function fileEXIFRead() {
            if(!checkFile()) return; speakText("Analyzing image metadata.");
            const termId = appendMessage("Jarvis", `<span class="text-cyan-muted">[*] Extracting EXIF from: ${attachedFile.name}</span>\n`, 'terminal'); const out = document.getElementById(termId);
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let exifObj = piexif.load(e.target.result); let hasExif = false; let output = `\n<span class="text-green-muted">[+] METADATA LOCATED:</span>\n`;
                    for (let ifd in exifObj) {
                        if (ifd == "thumbnail") continue;
                        for (let tag in exifObj[ifd]) {
                            hasExif = true; let tagName = piexif.TAGS[ifd][tag]["name"]; let tagValue = exifObj[ifd][tag];
                            if(typeof tagValue === 'string' && tagValue.length > 50) tagValue = tagValue.substring(0, 50) + "...";
                            output += `  ${tagName}: ${tagValue}\n`;
                        }
                    }
                    if (!hasExif) out.innerHTML += `\n<span class="text-yellow-muted">[-] No EXIF metadata found.</span>`;
                    else out.innerHTML += output;
                } catch (err) { out.innerHTML += `<span class="text-red-muted">[-] Error parsing EXIF.</span>`; }
                out.scrollTop = out.scrollHeight; clearFile();
            }; reader.readAsDataURL(attachedFile);
        }

        function fileSignature() {
            if(!checkFile()) return; speakText("Analyzing file signature.");
            const termId = appendMessage("Jarvis", `<span class="text-cyan-muted">[*] Reading File Header for: ${attachedFile.name}</span>\n`, 'terminal'); const out = document.getElementById(termId);
            const reader = new FileReader();
            reader.onload = function(e) {
                const arr = (new Uint8Array(e.target.result)).subarray(0, 4);
                let hex = ""; for(let i = 0; i < arr.length; i++) hex += arr[i].toString(16).padStart(2, '0').toUpperCase();
                const magicBytesDict = { "FFD8FFE0": "JPEG Image", "FFD8FFE1": "JPEG Image (EXIF)", "89504E47": "PNG Image", "25504446": "PDF Document", "504B0304": "ZIP Archive", "52617221": "RAR Archive", "4D5A": "Windows Executable" };
                let matchType = magicBytesDict[hex] || (magicBytesDict[hex.substring(0,4)] || "Unknown Binary");
                out.innerHTML += `\nHex Header: <span class="text-yellow-muted">${hex}</span>\nSignature: <span class="text-green-muted">${matchType}</span>`;
                out.scrollTop = out.scrollHeight; clearFile();
            }; reader.readAsArrayBuffer(attachedFile.slice(0, 4));
        }

        function initMatrix() {
            const canvas = document.getElementById('matrix-bg'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const chars = '01'; const fontSize = 14; let cols = Math.floor(canvas.width / fontSize) + 1; let ypos = Array(cols).fill(0).map(() => Math.random() * -100);
            setInterval(() => {
                ctx.fillStyle = 'rgba(5, 8, 15, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = 'rgba(139, 195, 74, 0.25)'; ctx.font = fontSize + 'px "Share Tech Mono", monospace'; ctx.textAlign = 'center';
                ypos.forEach((y, ind) => { ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), ind * fontSize + (fontSize/2), y * fontSize); if (y * fontSize > canvas.height && Math.random() > 0.975) ypos[ind] = 0; ypos[ind]++; });
            }, 60);
        }
    </script>
