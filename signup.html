<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phish-Net - Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script type="text/javascript">
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element'); }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root { --clr-bg: #05080f; --clr-panel: rgba(12, 18, 28, 0.92); --clr-cyan: #5bc0be; --clr-pink: #d48bbd; --clr-text: #cdd6f4; --clr-red: #d9534f; --clr-green: #8bc34a;}
        body { font-family: 'Share Tech Mono', monospace; background-color: var(--clr-bg); color: var(--clr-text); margin: 0; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        .cyber-panel { background: var(--clr-panel); border: 1px solid var(--clr-pink); box-shadow: 0 0 5px rgba(212, 139, 189, 0.15); backdrop-filter: blur(4px); border-radius: 3px; }
        .cyber-input { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--clr-cyan); color: #fff; width: 100%; padding: 12px 15px; outline: none; transition: 0.3s; border-radius: 2px; }
        .cyber-input:focus { border-color: var(--clr-pink); box-shadow: 0 0 5px rgba(212, 139, 189, 0.2); }
        .btn-action { border: 1px solid var(--clr-pink); color: var(--clr-pink); background: rgba(0,0,0,0.5); text-transform: uppercase; cursor: pointer; transition: all 0.2s; border-radius: 2px; }
        .btn-action:hover { background: rgba(212, 139, 189, 0.15); }
        .auth-link { color: var(--clr-cyan); cursor: pointer; text-decoration: underline; transition: 0.3s; }
        .goog-te-combo { background-color: #05080f !important; color: var(--clr-cyan) !important; border: 1px solid var(--clr-cyan) !important; border-radius: 4px !important; padding: 6px !important; font-family: 'Share Tech Mono', monospace !important; font-size: 14px !important; outline: none; cursor: pointer; }
        .goog-te-combo option { background-color: #05080f; color: #fff; }
        .goog-te-gadget { font-family: 'Share Tech Mono', monospace !important; color: rgba(255,255,255,0.5) !important; font-size: 10px !important; display: flex; flex-direction: column; align-items: flex-end;}
        .goog-te-gadget .goog-logo-link, .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <canvas id="matrix-bg"></canvas>
    <div id="google_translate_element" class="absolute top-4 right-4 z-50"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="cyber-panel p-10 text-center relative">
            <i class="fa-solid fa-user-plus text-6xl mb-4 opacity-80" style="color: var(--clr-pink);"></i>
            <h2 class="text-2xl font-bold tracking-widest mb-2" style="color: var(--clr-pink);">DATABASE REGISTRATION</h2>
            <p class="text-xs text-[#7f849c] mb-8 tracking-widest">SECURE SQLITE INTEGRATION</p>
            
            <input type="email" id="signup-email" class="cyber-input mb-4" placeholder="operator@domain.com">
            <input type="password" id="signup-pass" class="cyber-input mb-4" placeholder="Password">
            <input type="password" id="signup-conf" class="cyber-input mb-8" placeholder="Confirm Password">
            
            <button onclick="registerUser()" class="btn-action w-full py-3 mb-4" id="btn-reg">CREATE ACCOUNT <i class="fa-solid fa-server ml-2"></i></button>
            <p class="text-xs text-[#7f849c]">Already Registered? <a href="login.html" class="auth-link">Return to Login</a></p>
            
            <div id="signup-error" class="text-red-500 text-xs mt-4 hidden font-bold bg-red-900/20 p-2 border border-red-500 rounded"></div>
            <div id="signup-success" class="text-green-500 text-xs mt-4 hidden font-bold bg-green-900/20 p-2 border border-green-500 rounded">REGISTRATION SUCCESSFUL. REDIRECTING...</div>
        </div>
    </div>

    <script>
        async function registerUser() {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;
            const conf = document.getElementById('signup-conf').value;
            const errBox = document.getElementById('signup-error');
            const successBox = document.getElementById('signup-success');
            const btn = document.getElementById('btn-reg');
            
            errBox.classList.add('hidden'); successBox.classList.add('hidden');

            if(!email || !email.includes('@')) { errBox.innerText = "ERROR: VALID EMAIL REQUIRED."; errBox.classList.remove('hidden'); return; }
            if(!pass || pass !== conf) { errBox.innerText = "ERROR: PASSWORDS DO NOT MATCH."; errBox.classList.remove('hidden'); return; }

            btn.innerText = "PROCESSING...";

            try {
                const response = await fetch('https://real-time-ai-ml-based-phishing-detection-4jfd.onrender.com/api/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: pass })
                });
                const data = await response.json();
                
                if(data.status === 'success') {
                    successBox.classList.remove('hidden');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    errBox.innerText = data.message; errBox.classList.remove('hidden'); btn.innerText = "CREATE ACCOUNT";
                }
            } catch(e) {
                errBox.innerText = "CRITICAL: Python Backend Offline."; errBox.classList.remove('hidden'); btn.innerText = "CREATE ACCOUNT";
            }
        }

        const canvas = document.getElementById('matrix-bg'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = '01'; const fontSize = 14; let cols = Math.floor(canvas.width / fontSize) + 1; let ypos = Array(cols).fill(0).map(() => Math.random() * -100);
        setInterval(() => { ctx.fillStyle = 'rgba(5, 8, 15, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = 'rgba(139, 195, 74, 0.25)'; ctx.font = fontSize + 'px monospace'; ctx.textAlign = 'center'; ypos.forEach((y, ind) => { ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), ind * fontSize + (fontSize/2), y * fontSize); if (y * fontSize > canvas.height && Math.random() > 0.975) ypos[ind] = 0; ypos[ind]++; }); }, 60);
    </script>
</body>
</html>
